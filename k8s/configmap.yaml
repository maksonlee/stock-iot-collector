apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-iot-collector-config
  namespace: stock
data:
  STOCK_CONFIG_PATH: /etc/stock-iot-collector/stocks.yaml
  DAILY_MARKET_DAYS_AGO: "1"
  BACKFILL_MARKET_DAYS: "0"
  POLYGON_MAX_RETRIES: "5"
  POLYGON_RETRY_BASE_SECONDS: "60"
  POLL_INTERVAL_SECONDS: "3600"
  PUBLISH_CHUNK_SIZE: "50"
  PUBLISH_CHUNK_DELAY_SECONDS: "0.1"
  THINGSBOARD_MQTT_HOST: "thingsboard.example.com"
  THINGSBOARD_MQTT_PORT: "8883"
  THINGSBOARD_MQTT_CLIENT_ID: "stock-collector-01"

  stocks.yaml: |
    stocks:
      - symbol: "*"
