apiVersion: v1
kind: Secret
metadata:
  name: stock-iot-collector-secret
  namespace: stock
type: Opaque
stringData:
  POLYGON_API_KEY: "replace-me"

  # Prefer creating this secret with kubectl --from-file instead of editing real
  # certificate/key material into this example file.
  ca.crt: "replace-with-ca-certificate-pem"
  client.crt: "replace-with-client-certificate-pem"
  client.key: "replace-with-client-private-key-pem"
